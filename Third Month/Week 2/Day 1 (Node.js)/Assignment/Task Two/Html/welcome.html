<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Two</title>
  <link rel="stylesheet" href="../Css/main.css" />
</head>

<body>
  <h1>Welcome {clientName} your entered data as follows:</h1>
  <ul class="ulMain">
    <li><b>MobileNumber</b> : { MobileNumber }</li>
    <li><b>Email</b> : { Email }</li>
    <li><b>Address</b> : { Address }</li>
  </ul>
  <button id="show">Show More</button>
  <div id="user_list"></div>
  <script>
    async function deleteUser(id) {
      const confirmed = confirm("Are you sure you want to delete this user?");
      if (!confirmed) return;

      const res = await fetch(`/deleteUser/${id}`, {
        method: "DELETE",
      });

      const data = await res.json();

      if (res.ok) {
        alert(data.message || "User deleted");
        document.getElementById("show").click(); 
      } else {
        alert(data.message || "Failed to delete user.");
      }
    }
    async function editUser(id) {
      const res = await fetch("/params_data.json");
      const users = await res.json();
      const user = users.find(u => u.id === id);

      if (!user) {
        return alert("User not found!");
      }

      // Prompt for new values
      const name = prompt("Enter new name:", user.name);
      const mobile = prompt("Enter new mobile:", user.mobile);
      const email = prompt("Enter new email:", user.email);
      const addr = prompt("Enter new address:", user.addr);

      const updatedUser = { name, mobile, email, addr };

      const updateRes = await fetch(`/updateUser/${id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(updatedUser)
      });

      const data = await updateRes.json();
      if (updateRes.ok) {
        alert(data.message || "User updated.");
        document.getElementById("show").click();
      } else {
        alert(data.error || "Failed to update user.");
      }
    }
    const btn = document.getElementById("show");
    btn.addEventListener("click", async () => {
      const res = await fetch("/params_data.json");
      const data = await res.json();
      console.log(data);
      let list = "<ul>";
      data.forEach((user) => {
        list += `<div>
            <li>Name: ${user.name}, Mobile: ${user.mobile}, Email: ${user.email}, Address: ${user.addr}</li> 
            <div>
 <button onclick="editUser(${user.id})">Edit</button>
 <button onclick="deleteUser(${user.id})">Delete</button>            </div>
            </div>
          `;
      });
      list += "</ul>";
      document.getElementById("user_list").innerHTML = list;
    });
  </script>
  <script src="../index.js"></script>
</body>

</html>
